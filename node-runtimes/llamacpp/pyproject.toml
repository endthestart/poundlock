[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poundlock-llamacpp"
version = "0.3.0"
description = "Generic llama.cpp node runtime for Poundlock: start, keep warm and stop llama-server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
poundlock-llamacpp = "poundlock_llamacpp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional stay: Python 3.9 target
  "RUF012",  # class-level defaults in test cases are per-instance overridden
  "SIM105", "SIM117",  # explicit try/except and nested with read better here
  "RUF005",
]

[tool.mypy]
python_version = "3.10"  # oldest mypy supports; the code itself targets 3.9
strict = true
mypy_path = "src"
