openapi: 3.1.0
info:
  title: Poundlock application API
  version: 0.4.4
  x-poundlock-api-major: 1
  x-poundlock-contract-revision: 7
  description: >-
    Contract revision 7 (API major 1) of the authenticated client contract for
    model discovery, inference, managed external access, usage, and durable
    jobs. `GET /api/v1/capabilities` reports the revision a running controller
    implements; clients must compare it rather than infer compatibility from
    the product version. Operator and node administration routes are
    intentionally outside this document. Any route except `/healthz` may answer
    503 with code `controller_busy` and `Retry-After: 1` when the controller is
    at its limit of requests in flight.
servers:
  - url: /
security:
  - applicationToken: []
paths:
  /healthz:
    get:
      summary: Controller process liveness
      security: []
      responses:
        "200": { description: The controller process is serving requests }
  /readyz:
    get:
      summary: Controller/storage readiness
      description: >-
        Reports only that the controller is serving and its SQLite store
        answers. It does not establish runner, node, model endpoint, credential
        or capacity readiness; use access preflight and job options for those.
      security: []
      responses:
        "200":
          description: Controller storage is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, scope, checks, version]
                properties:
                  status: { const: ready }
                  scope: { const: controller_storage }
                  checks:
                    type: object
                    properties:
                      storage: { const: ok }
                  version: { type: string }
        "503":
          description: Controller storage is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/capabilities:
    get:
      summary: Read the supported contract revision and optional features
      description: Any active API token may read this, whatever its permissions.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /v1/models:
    get:
      summary: List deliberately published model profiles
      responses:
        "200":
          description: OpenAI-compatible model list with Poundlock metadata
          content:
            application/json:
              schema:
                type: object
                required: [object, data, poundlock]
                properties:
                  object: { const: list }
                  poundlock:
                    type: object
                    required: [schema_version, contract_revision]
                    properties:
                      schema_version: { type: integer }
                      contract_revision: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelProfile" }
  /v1/capacity:
    get:
      summary: Who holds each exclusive model slot, and who waits for it
      description: >-
        Revision 5. Each slot that is held or has a line: the kind of holder
        and the waiters in the order the slot goes to them, by class and
        time waited. No prompts, tokens or sessions. Requires `models:read`.
      responses:
        "200":
          description: The lines
          content:
            application/json:
              schema:
                type: object
                required: [object, max_wait_seconds, default_wait_seconds, slots]
                properties:
                  object: { const: capacity }
                  max_wait_seconds: { type: integer }
                  default_wait_seconds: { type: integer }
                  held_stream_seconds:
                    type: integer
                    description: >-
                      How long a streamed request without `Poundlock-Wait` or a
                      ticket waits on its open stream.
                  slots:
                    type: array
                    items:
                      type: object
                      required: [slot, models, holder_kind, waiting]
                      properties:
                        slot: { type: string }
                        models: { type: array, items: { type: string } }
                        holder_kind: { type: [string, "null"], enum: [interactive, job, null] }
                        waiting:
                          type: array
                          items:
                            type: object
                            required: [class, kind, waited_seconds]
                            properties:
                              class: { enum: [owner, planner, worker, background] }
                              kind: { enum: [request, job] }
                              waited_seconds: { type: integer }
  /v1/chat/completions:
    post:
      summary: Relay an OpenAI-compatible chat completion through a profile
      description: >-
        A profile served by llama.cpp carries a `reasoning_effort` to the
        server as `chat_template_kwargs` (`enable_thinking`, `reasoning_effort`),
        because llama.cpp ignores the top-level field. That profile also accepts
        `thinking_budget_tokens`, a whole number from 1 to its
        `poundlock.max_output_tokens`, and says so with
        `poundlock.reasoning.thinking_budget_tokens` (`max`, `default`) on
        `/v1/models`. Other profiles omit that key and refuse the field.
      parameters:
        - { $ref: "#/components/parameters/Wait" }
        - { $ref: "#/components/parameters/Priority" }
        - { $ref: "#/components/parameters/Session" }
        - { $ref: "#/components/parameters/QueueTicket" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OpenAI-compatible completion or stream
          headers:
            x-poundlock-request-id: { $ref: "#/components/headers/RequestId" }
            x-poundlock-served-model: { $ref: "#/components/headers/ServedModel" }
            x-poundlock-response-cost: { $ref: "#/components/headers/ResponseCost" }
            x-poundlock-frontier-budget-state: { $ref: "#/components/headers/FrontierBudgetState" }
            x-poundlock-frontier-budget-remaining: { $ref: "#/components/headers/FrontierBudgetRemaining" }
        "400": { $ref: "#/components/responses/UnsupportedReasoningEffort" }
        "403": { $ref: "#/components/responses/ExternalAccessRefused" }
        "404": { $ref: "#/components/responses/UnknownModel" }
        "409": { $ref: "#/components/responses/CapacityInUse" }
        "429": { $ref: "#/components/responses/CapacityQueueFull" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/RuntimeUnavailable" }
        "504": { $ref: "#/components/responses/UpstreamFailure" }
  /v1/completions:
    post:
      summary: Relay an OpenAI-compatible completion through a profile
      parameters:
        - { $ref: "#/components/parameters/Wait" }
        - { $ref: "#/components/parameters/Priority" }
        - { $ref: "#/components/parameters/Session" }
        - { $ref: "#/components/parameters/QueueTicket" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OpenAI-compatible completion or stream
          headers:
            x-poundlock-request-id: { $ref: "#/components/headers/RequestId" }
            x-poundlock-served-model: { $ref: "#/components/headers/ServedModel" }
            x-poundlock-response-cost: { $ref: "#/components/headers/ResponseCost" }
            x-poundlock-frontier-budget-state: { $ref: "#/components/headers/FrontierBudgetState" }
            x-poundlock-frontier-budget-remaining: { $ref: "#/components/headers/FrontierBudgetRemaining" }
        "400": { $ref: "#/components/responses/UnsupportedReasoningEffort" }
        "403": { $ref: "#/components/responses/ExternalAccessRefused" }
        "404": { $ref: "#/components/responses/UnknownModel" }
        "409": { $ref: "#/components/responses/CapacityInUse" }
        "429": { $ref: "#/components/responses/CapacityQueueFull" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/RuntimeUnavailable" }
        "504": { $ref: "#/components/responses/UpstreamFailure" }
  /api/v1/access/preflight:
    post:
      summary: Prepare and report application-scoped access without inference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string, description: Profile name or UUID }
                operation:
                  type: string
                  enum: [inference, job]
                  default: inference
                  description: Selects the ordinary permission checked before access is prepared
      responses:
        "200":
          description: >-
            Current admission state. Credential and policy reasons take
            precedence; when those pass, inference preflight also reports node
            runtime state. Only a real block changes `availability`
            (`blocked` with a `runtime_*` reason); an on-demand wake and an
            occupied exclusive slot are additive (`runtime_state`, `capacity`).
            Job preflight reports `runner_status` and never slot occupancy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessState" }
  /api/v1/usage:
    get:
      summary: Read this application token's managed LiteLLM usage and the install's frontier budget
      responses:
        "200":
          description: >-
            Application-scoped policy and fresh usage, or explicit
            unavailability. Since revision 6, `frontier_budget` is the whole
            install's standing against its weekly and monthly ceilings: the
            same for every application, and never who spent it.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  schema_version: { type: integer, const: 1 }
                  frontier_budget: { $ref: "#/components/schemas/FrontierBudget" }
  /api/v1/job-options:
    get:
      summary: List durable profiles, harnesses, and submission limits
      responses:
        "200": { description: Durable job options }
  /api/v1/jobs:
    get:
      summary: List jobs, newest first, as summaries without their policy, result or error (a token sees only its own jobs)
      responses:
        "200": { description: Jobs }
    post:
      summary: Submit a replay-safe durable job
      description: >-
        Since revision 7 (`job_budget`), `policy.budget` may cap the job:
        `wall_seconds` (60 to 86,400) shortens the runner's wall clock for it,
        and `frontier_cents` caps its external-model spend. Once recorded spend
        reaches the cap, the job's next external request is refused with
        `job_budget_exhausted`; a model with no price is refused with
        `job_budget_unpriced`. Job options publish the bounds in `policy_limits`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Submitted or idempotently replayed job }
        "403": { $ref: "#/components/responses/ExternalPermissionRequired" }
        "409": { description: Idempotency key was reused for different input }
        "429": { $ref: "#/components/responses/TooManyActiveJobs" }
  /api/v1/jobs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: A job with its policy, result and error (a token reads only its own jobs)
      responses:
        "200": { description: "Job. Since revision 7 it carries `frontier_spend_usd`, its recorded external-model spend." }
        "404": { description: No such job, or not this token's }
  /api/v1/jobs/{id}/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: A job's events, oldest first
      responses:
        "200": { description: Events }
        "404": { description: No such job, or not this token's }
  /api/v1/jobs/{id}/patches/{index}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      summary: Download one of a finished job's patches, as text
      responses:
        "200": { description: Patch }
        "404": { description: No such job, patch, or not this token's }
  /api/v1/jobs/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Ask a job to stop; its uploaded source is deleted, and its prompt, results and events are kept
      responses:
        "200": { description: Cancellation requested }
        "404": { description: No such job, or not this token's }
components:
  parameters:
    Wait:
      name: Poundlock-Wait
      in: header
      description: >-
        Revision 5. Seconds to hold the request while its model's exclusive
        slot is busy, at most 110 (under the hub proxy's timeout). Nothing is
        sent before the slot is the request's. Without it the operator's
        default applies (`default_wait_seconds` on `/v1/capacity`, 110 unless
        the operator sets it; zero answers at once, as before revision 5). A
        streamed request (`"stream": true`) without it or a ticket is not told
        "busy": it gets its 200 and event stream at once and waits on it, an SSE
        comment (`: waiting for MODEL, position N`) every 15 seconds, for up to
        `held_stream_seconds` (600). Its turn streams as usual; an error after
        the status was sent arrives as one `data:` event holding the usual
        `{"error": …}` body.
      schema: { type: integer, minimum: 0, maximum: 110 }
    Priority:
      name: Poundlock-Priority
      in: header
      description: >-
        Revision 5. The request's class in line: `owner` (a person waits on
        it), `planner`, `worker` (the default) or `background`. `owner` and
        `planner` need the token's `inference:priority` permission; without it
        they count as `worker`. A request without this header waits as `owner`
        when its token has that permission (an application a person waits on,
        such as a chat app), otherwise as `worker`. A waiter rises one class per minute waited,
        and durable jobs wait as `background`. There is no preemption: a
        request in flight finishes first.
      schema: { enum: [owner, planner, worker, background] }
    Session:
      name: Poundlock-Session
      in: header
      description: >-
        Revision 5. The client's conversation, at most 128 characters. For 10
        seconds after a session's request ends, its next request goes ahead of
        others of the same class, so the runtime's prompt cache stays warm.
      schema: { type: string, maxLength: 128 }
    QueueTicket:
      name: Poundlock-Queue-Ticket
      in: header
      description: >-
        Revision 5. The `queue.ticket` of an earlier 409 from the same token:
        sent within 60 seconds, the request takes back its place in line.
      schema: { type: string, maxLength: 64 }
  headers:
    RequestId:
      description: Correlates this response with controller diagnostics and gateway attribution
      schema: { type: string, format: uuid }
    ServedModel:
      description: >-
        What answered behind the stable profile name, when the operator's
        route catalog records it (the body's `model` is the route name).
        Revision 4.
      schema: { type: string }
    ResponseCost:
      description: >-
        The gateway's own cost estimate for this call in US dollars, when it
        reports one, as a non-negative decimal (exponent notation allowed).
        An estimate, not a bill. Revision 4.
      schema: { type: string }
    FrontierBudgetState:
      description: >-
        On a request to an external profile while the operator has set a
        frontier budget: the install's standing before this request, `ok` or
        `low` (past the warning share). Revision 6.
      schema: { enum: [ok, low] }
    FrontierBudgetRemaining:
      description: >-
        On the same requests: US dollars left in the tightest period before
        this request, counting requests still in flight. Revision 6.
      schema: { type: string }
  securitySchemes:
    applicationToken:
      type: http
      scheme: bearer
  schemas:
    Capabilities:
      type: object
      required: [schema_version, api_major, contract_revision, product_version, features]
      properties:
        schema_version: { type: integer, const: 1 }
        api_major: { type: integer, const: 1 }
        contract_revision: { type: integer, minimum: 1 }
        product_version: { type: string }
        features: { type: array, items: { type: string } }
        caller_permissions:
          type: array
          description: >-
            Feature caller_permissions. The permissions of the token that made
            this request.
          items: { type: string }
        token_permissions:
          type: array
          description: >-
            Feature permission_labels. Every API token permission with the
            label to show for it.
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }
        verifier:
          type: object
          properties:
            python: { type: string }
            uv: { type: string }
            writable_exec_paths:
              type: array
              items: { type: string }
    AccessState:
      type: object
      required: [schema_version, profile_id, profile_name, availability, connection_mode]
      properties:
        schema_version: { type: integer, const: 1 }
        profile_id: { type: string }
        profile_name: { type: string }
        operation: { enum: [inference, job] }
        availability:
          enum: [available, preparation_required, busy, blocked]
        availability_reason:
          type: [string, "null"]
          description: >-
            Known values include the blocked reasons plus
            managed_identity_not_provisioned, runtime_wake_required and
            capacity_in_use. Treat unrecognized values as unavailable.
        blocked_reason:
          type: [string, "null"]
          description: >-
            Credential/policy: inference_permission_required,
            job_submission_permission_required, external_permission_required,
            data_destination_confirmation_required, managed_budget_required,
            managed_identity_provision_failed,
            managed_identity_reconciliation_required,
            managed_identity_unavailable, frontier_budget_exhausted,
            frontier_budget_unpriced (revision 6). Runtime (inference only):
            runtime_node_missing, runtime_node_unavailable,
            runtime_node_network_unavailable, runtime_node_offline,
            runtime_wake_unavailable.
        warning_reason:
          type: [string, "null"]
          description: >-
            data_destination_unknown, frontier_budget_low (revision 6) or, for
            job preflight, runner_not_connected
        runtime_state:
          enum: [preparation_required]
          description: >-
            Inference preflight only. The node will be woken or prepared by the
            relay; the request is not blocked.
        runtime_reason:
          type: string
          description: Reason for runtime_state, for example runtime_wake_required
        capacity:
          enum: [in_use]
          description: >-
            Inference preflight only. The exclusive slot is currently occupied;
            the request may receive HTTP 409 capacity_in_use and should be
            retried unchanged.
        capacity_reason:
          type: string
          description: capacity_in_use
        runner_status:
          enum: [connected, not_seen]
          description: >-
            Job preflight only. Whether a runner contacted the controller
            recently. Diagnostic, not an admission gate; queued jobs wait.
        connection_mode:
          enum: [direct, gateway_only, managed_applications]
        data_destination:
          enum: [operator_network, external, unknown]
        usage: { type: [object, "null"], additionalProperties: true }
        frontier_budget:
          $ref: "#/components/schemas/FrontierBudgetSummary"
          description: External profiles only, while the operator has set a frontier budget (revision 6).
    FrontierBudgetSummary:
      type: object
      required: [state]
      properties:
        state: { enum: [ok, low, exhausted] }
        remaining_usd: { type: [number, "null"], description: Dollars left in the tightest period }
        resets_at:
          type: [string, "null"]
          format: date-time
          description: When the latest period that is not ok resets
    FrontierBudget:
      type: object
      required: [configured, state, warn_at, utc_offset_minutes, periods]
      description: >-
        One weekly and one monthly ceiling on what requests to external
        profiles cost, across every application and durable job. Poundlock
        meters each request: the gateway's cost, else the provider's, else
        reported tokens at the profile's published price, else its admission
        estimate. Spend is an estimate, never a bill. Revision 6.
      properties:
        configured: { type: boolean }
        state: { enum: [unconfigured, ok, low, exhausted] }
        remaining_usd: { type: [number, "null"] }
        warn_at: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        utc_offset_minutes:
          type: integer
          description: Where weeks (Monday 00:00) and months (the 1st) begin, in minutes east of UTC
        periods:
          type: array
          items:
            type: object
            required: [period, limit_usd, spent_usd, in_flight_usd, remaining_usd, starts_at, resets_at, state]
            properties:
              period: { enum: [weekly, monthly] }
              limit_usd: { type: number }
              spent_usd: { type: number }
              in_flight_usd: { type: number, description: Estimates of requests admitted and still running }
              remaining_usd: { type: number }
              starts_at: { type: string, format: date-time }
              resets_at: { type: string, format: date-time }
              state: { enum: [ok, low, exhausted] }
    ModelProfile:
      type: object
      required: [id, object, owned_by, poundlock]
      properties:
        id: { type: string }
        object: { const: model }
        owned_by: { const: poundlock }
        busy: { type: boolean }
        availability:
          enum: [available, preparation_required, busy, blocked]
        availability_reason: { type: [string, "null"] }
        blocked_reason: { type: [string, "null"] }
        connection_mode:
          enum: [direct, gateway_only, managed_applications]
        poundlock:
          type: object
          additionalProperties: true
          description: >-
            Additive metadata. `capabilities` (contract feature
            `capability_evidence`) is an array of measured evidence entries
            pasted from the Toolkit; each carries `age_days`, `stale` and
            `settings_match`, computed fresh on every read and never stored.
            An empty array means unknown, not incapable. `frontier_budget`
            (revision 6) is a FrontierBudgetSummary on external profiles while
            the operator has set a frontier budget.
          properties:
            uses:
              type: array
              items: { enum: [completion, durable, interactive] }
              description: What the profile serves.
            workload_class:
              deprecated: true
              enum: [interactive-coding, durable-coding-agent, fast-code-completion]
              description: >-
                The single-class view of `uses`, for clients that predate it. Read
                `uses` instead. A later contract revision stops accepting
                `workload_class` when a profile is created or changed.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string }
            type: { type: string, description: poundlock_error for errors Poundlock itself returns }
            param: { type: string, description: The request field the error is about, when there is one }
            poundlock:
              type: object
              additionalProperties: true
              description: Additive detail for some codes; see the response that uses it.
    DidYouMean:
      type: object
      required: [name, profile_id, reason]
      properties:
        name: { type: string, description: The model name to send }
        profile_id: { type: string }
        reason:
          type: string
          description: >-
            server_model_id when the request sent this profile's server model
            ID (`poundlock.upstream_model`); similar_name for a match ignoring
            case or as a suffix. Treat other values as similar_name.
  responses:
    UnknownModel:
      description: >-
        unknown_model_profile: `model` is not a profile UUID, name or alias.
        The server model ID is never accepted in place of a name. The message
        says which name to send, and `error.param` is `model`. When the token
        also has models:read, `error.poundlock.did_you_mean` lists up to five
        names: exact server model ID matches first, then names, aliases or
        server model IDs that match ignoring case or as a suffix. Without
        models:read it is absent and the message names nothing. The status
        and code are stable; clients may probe permission with them.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      poundlock:
                        type: object
                        properties:
                          did_you_mean:
                            type: array
                            maxItems: 5
                            items: { $ref: "#/components/schemas/DidYouMean" }
    ExternalPermissionRequired:
      description: The application token lacks external:invoke
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExternalAccessRefused:
      description: >-
        external_permission_required when the application token lacks
        external:invoke; data_destination_confirmation_required when the
        operator has not confirmed where the profile sends data. Since
        revision 6, frontier_budget_exhausted when the install's weekly or
        monthly frontier budget is used up (the message names the period and
        when it resets; nothing was sent upstream), and
        frontier_budget_unpriced when an external profile has no published
        price while a budget is set. Do not retry these unchanged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CapacityInUse:
      description: >-
        capacity_in_use: the exclusive node/runtime slot stayed in use for the
        whole wait. Since revision 5 the body also carries `queue`: the
        request's `position` (1 is next), the `holder_kind`, how many are
        `waiting`, and, when the request waited, a `ticket` that keeps its
        place for 60 seconds (`Retry-After: 1`). A request that did not wait
        gets no ticket (`Retry-After: 15`).
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Error" }
              - type: object
                properties:
                  queue:
                    type: object
                    required: [position, holder_kind, waiting]
                    properties:
                      position: { type: integer, minimum: 1 }
                      ticket: { type: string }
                      holder_kind: { type: [string, "null"], enum: [interactive, job, null] }
                      waiting: { type: integer }
    CapacityQueueFull:
      description: >-
        capacity_queue_full (revision 5): 16 requests already wait for this
        slot, or 4 from this token. Nothing waited; try again later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyActiveJobs:
      description: >-
        too_many_active_jobs: the application token already has as many
        unfinished jobs as the operator allows (`active_jobs_per_token` in job
        options). Nothing was stored. Submit again after one of its jobs is
        completed, failed or cancelled. Replaying an existing job's
        idempotency key still returns that job.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamFailure:
      description: >-
        upstream_connection_failed (502) or upstream_timeout (504, no response
        headers in time). After headers, a stream that stops making progress
        for the idle timeout or fails upstream is terminated mid-body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedReasoningEffort:
      description: >-
        unsupported_reasoning_effort: the request named a reasoning_effort (or
        reasoning.effort) outside none, minimal, low, medium, high, xhigh, or
        one this profile has verified levels for and this is not among them.
        The message lists the supported values. Nothing is rewritten.
        invalid_thinking_budget: `thinking_budget_tokens` was not a whole
        number from 1 to the profile's output limit. Other invalid requests
        use invalid_request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RuntimeUnavailable:
      description: >-
        model_disabled when the profile was taken out of service after
        repeated authoritative not-found answers from its upstream. Otherwise,
        the model runtime could not be prepared. The code names the cause when
        known (runtime_node_* or runtime_wake_* as in AccessState;
        ensure_failed when the machine answered but could not prepare the
        model, which a retry may clear), otherwise infrastructure_unavailable;
        managed identity and endpoint problems use their own codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
