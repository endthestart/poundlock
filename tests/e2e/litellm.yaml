# LiteLLM gateway for --full: one route to the scripted model server. Keys and
# the database address come from the environment run.py generates per run.
model_list:
  - model_name: mock-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://mock-model:8080/v1
      api_key: mock-upstream-key
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 1024
      input_cost_per_token: 0
      output_cost_per_token: 0
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
